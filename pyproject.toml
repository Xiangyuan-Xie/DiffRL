[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffrl"
version = "0.1.0+acelab"
description = "ACELab-adapted DiffRL SHAC implementation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "PyYAML",
  "tensorboardX",
]

[project.optional-dependencies]
torch = ["torch"]
jax = ["jax", "optax", "flax", "orbax-checkpoint", "jax2onnx", "onnx"]

[tool.setuptools]
package-dir = { "diffrl" = "." }
packages = [
  "diffrl",
  "diffrl.algorithms",
  "diffrl.envs",
  "diffrl.jax_shac",
  "diffrl.models",
  "diffrl.utils",
]

[tool.setuptools.package-data]
"diffrl.jax_shac" = ["LICENSE.md", "NOTICE.md"]
